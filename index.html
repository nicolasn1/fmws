    <script>
      // In AI Studio Build preview environment, HMR is disabled.
      // Ignore Vite client WebSocket connection errors as per environment instructions.
      window.addEventListener('error', function(event) {
        if (event && (event.message?.includes('WebSocket') || event.filename?.includes('@vite/client'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason && (event.reason.message || String(event.reason));
        if (reason && (reason.includes('WebSocket') || reason.includes('@vite/client'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
